analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_use_of_internal_member: error
    invalid_use_of_visible_for_testing_member: error

linter:
  rules:
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - no_adjacent_strings_in_list
    - prefer_final_locals
    - unawaited_futures

