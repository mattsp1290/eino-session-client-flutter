version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.13.1 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  ag_ui_view_state:
    git:
      url: https://github.com/mattsp1290/eino-session-client-flutter.git
